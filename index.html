<style>

  body{display:block;padding:0}.site-header{position:relative}.game-layout{width:min(1240px,100%);margin:auto;padding:24px 30px 44px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;align-items:start}.board-column{min-width:0}.board-column canvas{display:block;width:100%;max-width:none;height:auto;aspect-ratio:560/620}.side-panel{min-width:0;padding-top:8px}.side-panel #status{margin:0;min-height:28px}.side-panel #game-controls{display:grid;grid-template-columns:1fr 1fr;margin:16px 0 20px;max-width:none;gap:10px}.side-panel #game-controls label{grid-column:1/-1;display:grid;gap:5px;color:var(--soft);font-size:12px}.side-panel #game-controls button{width:auto!important;margin:0}.side-panel #game-controls #tut-open{display:block;grid-column:1/-1}.record-wrap{margin:0;padding:18px 0 0}.move-number{color:#788177}.player-tag{display:inline-flex;align-items:center;gap:7px}.player-tag.red{color:var(--red)}.player-tag.black{color:var(--ink)}.player-tag.active{border-color:var(--ink);background:var(--ink);color:white}.player-tag.active.red{border-color:var(--red);background:var(--red)}#tutorial{display:none;grid-column:auto;grid-row:auto;max-width:none;margin:22px 0 0;padding:18px 0;border-top:1px solid var(--line)}.lesson-nav{display:flex;gap:8px;flex-wrap:wrap}.lesson-nav .spacer{flex:1}

<body>
<header><div class="brand-copy"><h1>弈境棋院</h1><p>一局一境，靜觀棋變</p></div></header>
<div id="top-player" class="player-strip"></div>
<div id="status"></div>
<canvas id="board" width="560" height="620"></canvas>
<div id="bottom-player" class="player-strip"></div>
<div id="tutorial">
  <h2 id="tut-title"></h2>
  <p id="tut-text"></p>
  <div class="controls">
    <button id="tut-prev">← 上一課</button>
    <button id="tut-reset">重來</button>
    <span id="tut-count" style="align-self:center"></span>
    <button id="tut-next">下一課 →</button>
    <button id="tut-exit">返回對局</button>
  </div>
</div>
<div class="controls" id="game-controls">
  <button id="tut-open">十課互動教學</button>
  <label>對戰模式
  <select id="mode">
    <option value="ai-random" selected>對電腦（隨機決定誰先走）</option>
    <option value="ai-red">對電腦（我執紅先行）</option>
    <option value="ai-black">對電腦（我執黑後行）</option>
    <option value="pvp">雙人同機</option>
  </select></label>
  <label>電腦難度
  <select id="level">
    <option value="1,500,0" selected>難度：新手</option>
    <option value="1,350">難度：入門</option>
    <option value="1,120">難度：簡單</option>
    <option value="2,40">難度：普通</option>
    <option value="3,6">難度：進階</option>
    <option value="4,6">難度：困難</option>
  </select></label>
  <button id="hint">請求提示</button>

</div>
<section class="record-wrap"><h2 class="record-title">本局走棋 <small>簡易座標・非正式記譜</small></h2><ol id="move-list" class="move-list"></ol></section>

<script>
/* ================= Engine ================= */
const NAMES = {K:'帥',A:'仕',E:'相',H:'傌',R:'俥',C:'炮',P:'兵',
               k:'將',a:'士',e:'象',h:'馬',r:'車',c:'砲',p:'卒'};
const VALUE = {K:10000,R:900,C:450,H:400,A:200,E:200,P:100};

const isRed = p => p === p.toUpperCase();

function initialBoard() {
  const b = Array.from({length:10}, () => Array(9).fill(null));
  const back = ['r','h','e','a','k','a','e','h','r'];
  back.forEach((p,c) => { b[0][c] = p; b[9][c] = p.toUpperCase(); });
  [1,7].forEach(c => { b[2][c] = 'c'; b[7][c] = 'C'; });
  [0,2,4,6,8].forEach(c => { b[3][c] = 'p'; b[6][c] = 'P'; });
  return b;
}

function gen(b, red) {
  const moves = [];
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = b[r][c];
    if (!p || isRed(p) !== red) continue;
    const t = p.toUpperCase();
    const add = (nr, nc) => {
      if (nr < 0 || nr > 9 || nc < 0 || nc > 8) return false;
      const q = b[nr][nc];
      if (q && isRed(q) === red) return false;
      moves.push([r, c, nr, nc]);
      return !q;
    };
    if (t === 'K') {
      const r0 = red ? 7 : 0, r1 = red ? 9 : 2;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = r + dr, nc = c + dc;
        if (nr >= r0 && nr <= r1 && nc >= 3 && nc <= 5) add(nr, nc);
      }
      const d = red ? -1 : 1;           // 王不見王
      for (let k = r + d; k >= 0 && k <= 9; k += d) {
        const q = b[k][c];
        if (q) { if (q === (red ? 'k' : 'K')) moves.push([r, c, k, c]); break; }
      }
    } else if (t === 'A') {
      const r0 = red ? 7 : 0, r1 = red ? 9 : 2;
      for (const [dr, dc] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
        const nr = r + dr, nc = c + dc;
        if (nr >= r0 && nr <= r1 && nc >= 3 && nc <= 5) add(nr, nc);
      }
    } else if (t === 'E') {
      for (const [dr, dc] of [[2,2],[2,-2],[-2,2],[-2,-2]]) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr > 9 || nc < 0 || nc > 8) continue;
        if (red ? nr < 5 : nr > 4) continue;
        if (b[r + dr / 2][c + dc / 2]) continue;
        add(nr, nc);
      }
    } else if (t === 'H') {
      for (const [dr, dc] of [[-2,-1],[-2,1],[2,-1],[2,1],[-1,-2],[1,-2],[-1,2],[1,2]]) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr > 9 || nc < 0 || nc > 8) continue;
        const lr = Math.abs(dr) === 2 ? r + dr / 2 : r;
        const lc = Math.abs(dr) === 2 ? c : c + dc / 2;
        if (b[lr][lc]) continue;
        add(r + dr, c + dc);
      }
    } else if (t === 'R') {
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        let nr = r + dr, nc = c + dc;
        while (add(nr, nc)) { nr += dr; nc += dc; }
      }
    } else if (t === 'C') {
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8 && !b[nr][nc]) {
          moves.push([r, c, nr, nc]); nr += dr; nc += dc;
        }
        nr += dr; nc += dc;
        while (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8) {
          const q = b[nr][nc];
          if (q) { if (isRed(q) !== red) moves.push([r, c, nr, nc]); break; }
          nr += dr; nc += dc;
        }
      }
    } else if (t === 'P') {
      const f = red ? -1 : 1;
      add(r + f, c);
      if (red ? r <= 4 : r >= 5) { add(r, c - 1); add(r, c + 1); }
    }
  }
  return moves;
}

function make(b, m) {
  const cap = b[m[2]][m[3]];
  b[m[2]][m[3]] = b[m[0]][m[1]];
  b[m[0]][m[1]] = null;
  return cap;
}
function unmake(b, m, cap) {
  b[m[0]][m[1]] = b[m[2]][m[3]];
  b[m[2]][m[3]] = cap;
}

function inCheck(b, red) {
  const king = red ? 'K' : 'k';
  let kr = -1, kc = -1;
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) if (b[r][c] === king) { kr = r; kc = c; }
  if (kr < 0) return true;
  return gen(b, !red).some(m => m[2] === kr && m[3] === kc);
}

function legalMoves(b, red) {
  const out = [];
  for (const m of gen(b, red)) {
    const cap = make(b, m);
    if (!inCheck(b, red)) out.push(m);
    unmake(b, m, cap);
  }
  return out;
}

function evaluate(b, red) {
  let s = 0;
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = b[r][c];
    if (!p) continue;
    const t = p.toUpperCase(), rd = isRed(p);
    let v = VALUE[t];
    if (t === 'P' && (rd ? r <= 4 : r >= 5)) v += 100;
    if (t === 'H' || t === 'R' || t === 'C') v += 12 - Math.abs(c - 4) * 3;
    s += rd ? v : -v;
  }
  return red ? s : -s;
}

const victim = (b, m) => (b[m[2]][m[3]] ? VALUE[b[m[2]][m[3]].toUpperCase()] : 0);
const attacker = (b, m) => VALUE[b[m[0]][m[1]].toUpperCase()];
// Most valuable victim first, then least valuable attacker
const byCapture = b => (x, y) => (victim(b, y) - victim(b, x)) || (attacker(b, x) - attacker(b, y));

// Keep searching captures past the depth limit so the AI sees recaptures (avoids the horizon effect)
function quiesce(b, alpha, beta, red, qdepth) {
  const stand = evaluate(b, red);
  if (stand >= beta || qdepth === 0) return stand;
  if (stand > alpha) alpha = stand;
  const caps = gen(b, red).filter(m => b[m[2]][m[3]]);
  caps.sort(byCapture(b));
  for (const m of caps) {
    if (b[m[2]][m[3]].toUpperCase() === 'K') return 10000;
    const cap = make(b, m);
    const v = -quiesce(b, -beta, -alpha, !red, qdepth - 1);
    unmake(b, m, cap);
    if (v >= beta) return v;
    if (v > alpha) alpha = v;
  }
  return alpha;
}

let qLimit = 4;  // capture-extension depth for the current search; 0 = don't look at recaptures

function negamax(b, depth, alpha, beta, red) {
  if (depth === 0) return quiesce(b, alpha, beta, red, qLimit);
  const moves = gen(b, red);
  moves.sort(byCapture(b));
  let best = -Infinity;
  for (const m of moves) {
    const target = b[m[2]][m[3]];
    if (target && target.toUpperCase() === 'K') return 10000 + depth;
    const cap = make(b, m);
    const v = -negamax(b, depth - 1, -beta, -alpha, !red);
    unmake(b, m, cap);
    if (v > best) best = v;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best === -Infinity ? -9000 : best;
}

// jitter = random noise added to each move's score: small keeps games varied,
// large makes the AI overlook gains and play weaker (used by easy levels)
function chooseMove(b, red, depth, jitter = 6, qdepth = 4) {
  const JITTER = jitter;
  qLimit = qdepth;
  const moves = legalMoves(b, red);
  if (!moves.length) return null;
  moves.sort(byCapture(b));
  let bestMove = null, bestScore = -Infinity;
  for (const m of moves) {
    const cap = make(b, m);
    // Moves that can't beat bestScore - JITTER are cut off early; jitter can't lift them past bestScore
    const v = -negamax(b, depth - 1, -Infinity, -(bestScore - JITTER), !red) + Math.random() * JITTER;
    unmake(b, m, cap);
    if (v > bestScore) { bestScore = v; bestMove = m; }
  }
  return bestMove;
}

/* ================= UI ================= */
const gameLayout = document.createElement('main'); gameLayout.className = 'game-layout';
const boardColumn = document.createElement('section'); boardColumn.className = 'board-column';
const sidePanel = document.createElement('aside'); sidePanel.className = 'side-panel';
const topPlayer = document.getElementById('top-player'), bottomPlayer = document.getElementById('bottom-player');
const gameControls = document.getElementById('game-controls'), recordWrap = document.querySelector('.record-wrap');
const statusNote = document.createElement('p'); statusNote.id = 'status-note'; statusNote.className = 'status-note';
document.getElementById('status').after(statusNote);
boardColumn.append(topPlayer, document.getElementById('board'), bottomPlayer, document.getElementById('tutorial'));
sidePanel.append(document.getElementById('status'), statusNote, gameControls, recordWrap); gameLayout.append(boardColumn, sidePanel);
document.querySelector('header').after(gameLayout);
const S = 60, M = 40;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let board, redTurn, selected, targets, history, lastMove, over, thinking, flip;
let tut = null;      // current lesson index, null when playing a normal game
let gameId = 0;      // invalidates pending AI moves after a reset
const moveList = document.getElementById('move-list');
const lessonCopy = [
  ['棋盤與九宮','棋盤由九條直線、十條橫線構成。雙方各有一座九宮，將帥只能在九宮內移動。點選紅帥，看看合法落點。'],
  ['車行直線','車沿橫線或直線走，途中不能越過其他棋子。棋路通暢時，車的控制範圍很大。試走動紅車。'],
  ['炮隔子吃','炮不吃子時和車一樣走直線；吃子時，炮與目標之間必須恰好隔著一枚棋子。試著移動紅炮。'],
  ['馬走日字','馬走日字形，先橫或直一格，再斜走一格。若第一步方向被棋子堵住，就是蹩馬腿，該方向不能走。'],
  ['象飛田字','相（象）走田字形，不能越過田字中心的棋子，也不能過河。紅相留在己方河界內活動。'],
  ['士與將帥','仕（士）沿九宮斜線走一格；帥（將）在九宮內橫走或直走一格。兩將不可在同一直線上直接照面。'],
  ['兵卒過河','兵卒未過河只能向前走；過河後可向前、向左或向右，但不能後退。試著移動已過河的紅兵。'],
  ['將軍與應將','當一方棋子直接威脅對方將帥時稱為將軍。被將軍的一方必須立刻解除威脅，不能走其他棋。'],
  ['一步將死','練習題：紅方先行。紅車沿中線將軍，黑將無處可逃。選取紅車，完成這步將軍。'],
  ['馬炮配合','練習題：紅方先行。善用馬的跳躍與炮的直線控制，找出能困住黑將的制勝一著。']
];

function updateMoveList() {
  moveList.replaceChildren();
  if (!history.length) { const li = document.createElement('li'); li.className='empty-record'; li.textContent='棋局開始後，走棋將記錄於此。'; moveList.append(li); return; }
  const pos = (r,c) => String.fromCharCode(65+c) + (10-r);
  for (let i=0; i<history.length; i+=2) {
    const row=document.createElement('li'); row.className='move-row';
    const no=document.createElement('span'); no.className='move-number'; no.textContent=(Math.floor(i/2)+1)+'.'; row.append(no);
    for (const h of [history[i],history[i+1]]) {
      const entry=document.createElement('span'); entry.className='move-entry';
      if (h) entry.textContent=pos(h.m[0],h.m[1])+'→'+pos(h.m[2],h.m[3])+(h.cap?' ×':'');
      row.append(entry);
    }
    moveList.append(row);
  }
}

function updatePlayers() {
  const mode=document.getElementById('mode').value;
  const player=(red)=>{
    const ai=mode!=='pvp' && aiRed===red, tag=document.createElement('span');
    tag.className='player-tag '+(red?'red':'black')+((tut===null&&red===redTurn)?' active':'');
    tag.textContent=(red?'紅方':'黑方')+'・'+(ai?'電腦':'玩家')+'　'+(tut!==null?'教學':red===redTurn?'行棋中':'等待'); return tag;
  };
  topPlayer.replaceChildren(player(flip)); bottomPlayer.replaceChildren(player(!flip));
}

function resizeBoard() {
  const dpr=window.devicePixelRatio||1, width=Math.round(560*dpr), height=Math.round(620*dpr);
  if (canvas.width!==width || canvas.height!==height) { canvas.width=width; canvas.height=height; ctx.setTransform(width/560,0,0,height/620,0,0); if(board) draw(); }
}

/* ================= Tutorial ================= */
const LESSONS = [
  { title: '帥／將', text: '帥（紅）與將（黑）是最重要的棋子，被將死就輸了。它只能待在<b>九宮</b>（畫斜線的 3×3 區域）裡，每次直走或橫走一格。<br>👉 點擊紅色的「帥」看看它能走到哪裡。',
    pieces: [[8,4,'K'],[2,3,'a'],[0,3,'k']] },
  { title: '仕／士', text: '仕也只能待在九宮裡，每次<b>斜走一格</b>，專門保護帥。',
    pieces: [[9,3,'K'],[8,4,'A'],[0,5,'k']] },
  { title: '相／象', text: '相走「田」字（斜走兩格），而且<b>不能過河</b>。如果「田」字中心有棋子擋住就不能走，稱為<b>塞象眼</b>。<br>👉 左上方被黑卒塞住了，試試看。',
    pieces: [[9,4,'K'],[7,4,'E'],[6,3,'p'],[0,3,'k']] },
  { title: '傌／馬', text: '馬走「日」字：先直走一格，再斜走一格。如果直走的那一格有棋子，就走不過去，稱為<b>蹩馬腿</b>。<br>👉 上方被自己的兵擋住了，所以往上的兩步不能走。',
    pieces: [[9,4,'K'],[5,4,'H'],[4,4,'P'],[0,3,'k']] },
  { title: '俥／車', text: '車可以直線走任意格數，但不能越過棋子；碰到對方棋子就能吃掉。它是威力最強的棋子。<br>👉 試著吃掉右邊的黑馬。',
    pieces: [[9,4,'K'],[5,4,'R'],[5,7,'h'],[0,3,'k']] },
  { title: '炮／砲', text: '炮不吃子時走法和車一樣；要吃子時，必須<b>隔著一個棋子</b>（稱為「炮架」）跳過去吃。<br>👉 隔著黑卒，吃掉最上面的黑車。',
    pieces: [[9,4,'K'],[7,1,'C'],[3,1,'p'],[0,1,'r'],[0,3,'k']] },
  { title: '兵／卒', text: '兵只能往前走一格，不能後退。<b>過河</b>（越過楚河漢界）之後，也可以左右橫走一格。<br>👉 比較左邊（未過河）和右邊（已過河）兩個兵。',
    pieces: [[9,4,'K'],[6,2,'P'],[3,6,'P'],[0,3,'k']] },
  { title: '王不見王', text: '帥和將不能在同一條直線上<b>面對面</b>（中間沒有其他棋子）。<br>👉 點擊帥：它不能往左走，因為那樣會和黑將面對面。',
    pieces: [[9,4,'K'],[0,3,'k']] },
  { title: '練習一：雙車錯殺', text: '攻擊對方的將叫<b>將軍</b>；對方怎麼走都解不了，就是<b>將死</b>，你就贏了（無路可走也算輸，叫「困斃」）。<br>🎯 紅方走一步將死黑將。提示：一隻車已經封住第二排。',
    pieces: [[9,3,'K'],[1,0,'R'],[5,8,'R'],[0,4,'k']], puzzle: true },
  { title: '練習二：馬後炮', text: '🎯 紅方走一步將死黑將。提示：讓馬當炮架，同時封住將的退路。這招叫「馬後炮」。',
    pieces: [[9,3,'K'],[4,3,'H'],[7,4,'C'],[0,4,'k']], puzzle: true },
];

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

function loadLesson(i) {
  if (i < 0 || i >= LESSONS.length) return;
  tut = i; gameId++;
  const lesson = LESSONS[i];
  board = Array.from({length:10}, () => Array(9).fill(null));
  lesson.pieces.forEach(([r, c, p]) => { board[r][c] = p; });
  redTurn = true; selected = null; targets = []; history = [];
  lastMove = null; over = false; thinking = false; flip = false;
  document.getElementById('tut-title').textContent = `第 ${i + 1} 課　${lessonCopy[i][0]}`;
  document.getElementById('tut-text').textContent = lessonCopy[i][1];
  document.getElementById('tut-count').textContent = `${i + 1} / ${LESSONS.length}`;
  document.getElementById('tut-prev').disabled = i === 0;
  document.getElementById('tut-next').disabled = i === LESSONS.length - 1;
  update();
}

function tutMove(m) {
  make(board, m);
  lastMove = m; selected = null; targets = [];
  if (!LESSONS[tut].puzzle) { update(); return; }
  over = true;
  draw();
  if (!legalMoves(board, false).length) {
    setStatus('答對了！黑將無路可走 🎉', 'win');
  } else {
    setStatus('還沒將死，再試一次…', 'check');
    const id = gameId;
    setTimeout(() => { if (id === gameId) loadLesson(tut); }, 1200);
  }
}

function showTutorial(on) {
  document.getElementById('tutorial').style.display = on ? 'block' : 'none';
  document.getElementById('game-controls').classList.toggle('hidden', on);
}

let aiRed = false;  // true: AI plays red, false: AI plays black, null: two players

function aiSide() { return aiRed; }

function newGame() {
  tut = null; gameId++;
  const mode = document.getElementById('mode').value;
  aiRed = mode === 'pvp' ? null
        : mode === 'ai-random' ? Math.random() < 0.5
        : mode === 'ai-black';
  board = initialBoard();
  redTurn = true; selected = null; targets = []; history = [];
  lastMove = null; over = false; thinking = false;
  flip = aiRed === true;
  update();
  maybeAI();
}

function px(r, c) {
  return [M + (flip ? 8 - c : c) * S, M + (flip ? 9 - r : r) * S];
}

function drawBoard() {
  ctx.fillStyle = '#eee4cf';
  ctx.fillRect(0, 0, 560, 620);
  ctx.strokeStyle = '#665d4b'; ctx.lineWidth = 1.35;
  const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  for (let r = 0; r < 10; r++) line(M, M + r * S, M + 8 * S, M + r * S);
  for (let c = 0; c < 9; c++) {
    if (c === 0 || c === 8) line(M + c * S, M, M + c * S, M + 9 * S);
    else { line(M + c * S, M, M + c * S, M + 4 * S); line(M + c * S, M + 5 * S, M + c * S, M + 9 * S); }
  }
  line(M + 3 * S, M, M + 5 * S, M + 2 * S); line(M + 5 * S, M, M + 3 * S, M + 2 * S);
  line(M + 3 * S, M + 7 * S, M + 5 * S, M + 9 * S); line(M + 5 * S, M + 7 * S, M + 3 * S, M + 9 * S);
  ctx.strokeRect(M - 4, M - 4, 8 * S + 8, 9 * S + 8);
  ctx.fillStyle = '#756b58'; ctx.font = '24px "Noto Serif TC","PMingLiU",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(flip ? '漢界' : '楚河', M + 2 * S, M + 4.5 * S);
  ctx.fillText(flip ? '楚河' : '漢界', M + 6 * S, M + 4.5 * S);
}

function drawPiece(r, c, p, highlight) {
  const [x, y] = px(r, c);
  const red = isRed(p);
  const face = ctx.createRadialGradient(x - 7, y - 8, 2, x, y, 27);
  face.addColorStop(0, '#fffef8'); face.addColorStop(1, '#e6dcc6');
  ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2);
  ctx.fillStyle = face; ctx.fill();
  ctx.lineWidth = highlight ? 3.5 : 1.5;
  ctx.strokeStyle = highlight ? '#315d49' : (red ? '#ad5146' : '#465349');
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 21, 0, Math.PI * 2);
  ctx.lineWidth = 1; ctx.strokeStyle = red ? '#ad5146' : '#465349'; ctx.stroke();
  ctx.fillStyle = red ? '#a43b32' : '#26352d';
  ctx.font = 'bold 28px "Noto Serif TC","PMingLiU",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(NAMES[p], x, y + 2);
}

function draw() {
  drawBoard();
  if (lastMove) {
    ctx.fillStyle = 'rgba(169,133,69,.22)';
    for (const [r, c] of [[lastMove[0], lastMove[1]], [lastMove[2], lastMove[3]]]) {
      const [x, y] = px(r, c); ctx.fillRect(x - 28, y - 28, 56, 56);
    }
  }
  const checked = !over && inCheck(board, redTurn) ? (redTurn ? 'K' : 'k') : null;
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = board[r][c];
    if (!p) continue;
    if (checked && p === checked) {
      const [x, y] = px(r, c);
      ctx.beginPath(); ctx.arc(x, y, 32, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(164,59,50,.28)'; ctx.fill();
    }
    drawPiece(r, c, p, selected && selected[0] === r && selected[1] === c);
  }
  for (const [r, c] of targets) {
    const [x, y] = px(r, c);
    ctx.beginPath(); ctx.arc(x, y, board[r][c] ? 30 : 8, 0, Math.PI * 2);
    if (board[r][c]) { ctx.lineWidth = 3; ctx.strokeStyle = '#a43b32'; ctx.stroke(); }
    else { ctx.fillStyle = '#a98545'; ctx.fill(); }
  }
}

function update() {
  const you = aiRed === null ? '' : `（你執${aiRed ? '黑' : '紅'}）`;
  const side = (redTurn ? '紅方' : '黑方') + you;
  statusEl.className = '';
  if (tut !== null) {
    setStatus(LESSONS[tut].puzzle ? '輪到紅方：一步將死黑將' : '點擊紅色棋子，看看它能走到哪裡');
  } else if (over) {
    // handled in finish()
  } else if (thinking) {
    statusEl.textContent = `電腦思考中…${you}`;
  } else if (inCheck(board, redTurn)) {
    statusEl.textContent = `將軍！輪到${side}`; statusEl.className = 'check';
  } else {
    statusEl.textContent = `輪到${side}`;
  }
  statusNote.textContent = over ? '可悔棋復盤，或重新開始。' : thinking ? '請稍候，電腦正在計算。' : '選取棋子查看合法落點';
  updatePlayers();
  updateMoveList();
  draw();
}

function finish() {
  if (legalMoves(board, redTurn).length) return false;
  over = true;
  statusEl.textContent = `${redTurn ? '黑方' : '紅方'}獲勝！（${inCheck(board, redTurn) ? '將死' : '困斃'}）— 按「悔棋」或「重新開始」`;
  statusEl.className = 'win';
  updatePlayers(); updateMoveList();
  draw();
  return true;
}

function play(m) {
  const cap = make(board, m);
  history.push({ m, cap });
  lastMove = m; selected = null; targets = [];
  redTurn = !redTurn;
  update();
  finish();
}

function maybeAI() {
  const ai = aiSide();
  if (over || ai === null || redTurn !== ai) return;
  thinking = true; update();
  // On a fresh board, pause so the player sees the reset before the AI's opening move
  const fresh = history.length === 0;
  if (fresh) setStatus('新局開始！電腦執紅先走…（你執黑）');
  const id = gameId;
  setTimeout(() => {
    if (id !== gameId) return;
    const [depth, jitter, qdepth = 4] = document.getElementById('level').value.split(',').map(Number);
    let m = null;
    try {
      m = chooseMove(board, redTurn, depth, jitter, qdepth);
    } catch (err) {
      setStatus('電腦出錯了，請按「悔棋」或「重新開始」', 'check');
    } finally {
      thinking = false;
    }
    if (m) play(m);
  }, fresh ? 1200 : 60);
}

canvas.addEventListener('click', e => {
  if (over || thinking) return;
  const ai = tut === null ? aiSide() : null;
  if (ai !== null && redTurn === ai) return;
  const rect = canvas.getBoundingClientRect();
  const style = getComputedStyle(canvas);
  const borderX = parseFloat(style.borderLeftWidth) || 0;
  const borderY = parseFloat(style.borderTopWidth) || 0;
  const x = (e.clientX - rect.left - borderX) * 560 / (rect.width - borderX - (parseFloat(style.borderRightWidth) || 0));
  const y = (e.clientY - rect.top - borderY) * 620 / (rect.height - borderY - (parseFloat(style.borderBottomWidth) || 0));
  let c = Math.round((x - M) / S), r = Math.round((y - M) / S);
  if (r < 0 || r > 9 || c < 0 || c > 8) return;
  if (flip) { c = 8 - c; r = 9 - r; }

  if (selected && targets.some(t => t[0] === r && t[1] === c)) {
    const m = [selected[0], selected[1], r, c];
    if (tut !== null) { tutMove(m); return; }
    play(m);
    maybeAI();
    return;
  }
  const p = board[r][c];
  if (p && isRed(p) === redTurn) {
    selected = [r, c];
    targets = legalMoves(board, redTurn).filter(m => m[0] === r && m[1] === c).map(m => [m[2], m[3]]);
    if (tut !== null) targets = targets.filter(([tr, tc]) => board[tr][tc] !== 'k');
  } else { selected = null; targets = []; }
  draw();
});

document.getElementById('tut-open').onclick = () => { showTutorial(true); loadLesson(0); };
document.getElementById('tut-prev').onclick = () => loadLesson(tut - 1);
document.getElementById('tut-next').onclick = () => loadLesson(tut + 1);
document.getElementById('tut-reset').onclick = () => loadLesson(tut);
document.getElementById('tut-exit').onclick = () => { showTutorial(false); newGame(); };
// Suggest a move for the player: pre-select the piece and mark its destination
document.getElementById('hint').onclick = () => {
  if (over || thinking || tut !== null) return;
  if (aiRed !== null && redTurn === aiRed) return;
  thinking = true;
  setStatus('想一下該怎麼走…');
  const id = gameId;
  setTimeout(() => {
    if (id !== gameId) return;
    let m = null;
    try {
      m = chooseMove(board, redTurn, 1, 0, 0);
    } catch (err) {
      m = null;
    } finally {
      thinking = false;
    }
    update();
    if (!m) return;
    selected = [m[0], m[1]];
    targets = [[m[2], m[3]]];
    draw();
    setStatus(`提示建議：把「${NAMES[board[m[0]][m[1]]]}」移至金色標記處`);
  }, 60);
};

document.getElementById('restart').onclick = newGame;
document.getElementById('mode').onchange = newGame;
document.getElementById('undo').onclick = () => {
  if (thinking || !history.length) return;
  const ai = aiSide();
  const steps = ai === null ? 1 : (redTurn === ai ? 1 : 2);
  for (let i = 0; i < steps && history.length; i++) {
    const h = history.pop(); unmake(board, h.m, h.cap); redTurn = !redTurn;
  }
  over = false; selected = null; targets = [];
  lastMove = history.length ? history[history.length - 1].m : null;
  update();
  maybeAI();  // undoing back to the AI's turn must let it move again
};

new ResizeObserver(resizeBoard).observe(canvas.parentElement);
resizeBoard();
newGame();
</script>
</body>
