<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線上象棋</title>
<style>
  :root {
    color-scheme: light;
    --ink:#28251f; --muted:#777064; --paper:#f4f0e7; --panel:#fffdf8;
    --line:#e5ddce; --red:#a6382e; --red-soft:#f8e9e4;
    --gold:#b58a48; --gold-soft:#f4ead7; --green:#39745b;
    --shadow:0 18px 50px rgba(56,43,25,.09);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:28px 22px 40px;
    background:
      radial-gradient(ellipse at 12% 0%, rgba(190,157,104,.13), transparent 34rem),
      var(--paper);
    color:var(--ink); font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  button,select { font:inherit; }
  .app-shell { width:min(1120px,100%); margin:0 auto; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
  .brand { display:flex; align-items:center; gap:13px; }
  .brand-mark {
    display:grid; place-items:center; width:46px; height:46px; border-radius:14px;
    color:#fff8eb; background:linear-gradient(145deg,#8d3029,#bd5742);
    font-family:"Noto Serif TC","PMingLiU",serif; font-size:25px;
    box-shadow:0 7px 18px rgba(141,48,41,.2);
  }
  h1 { margin:0; font-family:"Noto Serif TC","PMingLiU",serif; font-size:1.42rem; letter-spacing:.16em; }
  .brand-subtitle { margin:3px 0 0; color:var(--muted); font-size:.78rem; letter-spacing:.08em; }
  .top-note { color:var(--muted); font-size:.82rem; letter-spacing:.04em; }
  .game-layout { display:grid; grid-template-columns:minmax(0,1.18fr) minmax(310px,.82fr); gap:22px; align-items:start; }
  .board-panel,.side-card {
    background:var(--panel); border:1px solid rgba(129,105,68,.13);
    border-radius:22px; box-shadow:var(--shadow);
  }
  .board-panel { padding:20px; }
  .board-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 2px 14px; }
  .eyebrow { color:var(--gold); font-size:.7rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
  .board-heading h2 { margin:4px 0 0; font-family:"Noto Serif TC","PMingLiU",serif; font-size:1.12rem; letter-spacing:.08em; }
  .live-indicator { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:.76rem; white-space:nowrap; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(57,116,91,.1); }
  .board-frame {
    width:100%; padding:10px; border-radius:16px;
    background:linear-gradient(145deg,#ead5ad,#d8b77d);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.65),0 8px 22px rgba(80,54,22,.12);
  }
  canvas { display:block; width:100%; max-width:560px; height:auto; margin:0 auto; border-radius:9px; touch-action:manipulation; cursor:pointer; }
  #status {
    display:flex; align-items:center; gap:9px; min-height:48px; margin-top:15px;
    padding:11px 14px; border:1px solid var(--line); border-radius:12px;
    background:#faf7f0; color:#554b3c; font-size:.92rem; font-weight:700; line-height:1.5;
  }
  #status::before { content:""; flex:0 0 8px; width:8px; height:8px; border-radius:50%; background:var(--gold); }
  #status.check { color:var(--red); background:var(--red-soft); border-color:#efd3cb; }
  #status.check::before { background:var(--red); }
  #status.win { color:var(--green); background:#eaf3ed; border-color:#d3e6d9; }
  #status.win::before { background:var(--green); }
  .side-column { display:grid; gap:16px; }
  .side-card { padding:20px; }
  .section-heading { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .section-icon {
    display:grid; place-items:center; width:34px; height:34px; border-radius:10px;
    color:#8c642d; background:var(--gold-soft); font-size:16px;
  }
  .section-heading h2 { margin:0; font-size:.98rem; letter-spacing:.04em; }
  .section-heading p { margin:3px 0 0; color:var(--muted); font-size:.75rem; }
  .field-label { display:block; margin:0 0 7px; color:var(--muted); font-size:.76rem; font-weight:700; }
  .field-group { margin-bottom:14px; }
  select {
    width:100%; min-height:44px; padding:0 38px 0 12px; border:1px solid var(--line);
    border-radius:10px; background:#fffefa; color:var(--ink); font-size:.88rem; cursor:pointer;
    outline:none; transition:border-color .18s,box-shadow .18s;
  }
  select:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(181,138,72,.13); }
  .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:17px; }
  button {
    min-height:43px; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
    background:#fffefa; color:#51483b; font-size:.84rem; font-weight:700;
    cursor:pointer; transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;
  }
  button:hover:not(:disabled) { transform:translateY(-1px); border-color:#c5a46e; background:#fbf5e9; }
  button:focus-visible { outline:3px solid rgba(181,138,72,.28); outline-offset:2px; }
  button:disabled { opacity:.42; cursor:not-allowed; }
  .btn-primary { grid-column:1/-1; color:#fffaf1; border-color:#96372e; background:linear-gradient(135deg,#8f3029,#b34a3b); box-shadow:0 6px 14px rgba(143,48,41,.16); }
  .btn-primary:hover:not(:disabled) { background:linear-gradient(135deg,#7d2823,#a83f33); border-color:#7d2823; }
  .btn-accent { color:#805b27; border-color:#e6d4b4; background:#f8f0e2; }
  .help-copy { margin:0; color:var(--muted); font-size:.8rem; line-height:1.75; }
  #tutorial { display:none; padding:18px; border:1px solid #e8d8ba; border-radius:14px; background:#fbf5e9; }
  #tutorial h2 { margin:0 0 10px; color:#8c642d; font-family:"Noto Serif TC","PMingLiU",serif; font-size:1.12rem; }
  #tut-text { margin:0 0 16px; color:#554b3c; font-size:.88rem; line-height:1.9; }
  #tutorial .controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #tutorial .controls button { min-height:38px; padding:7px 8px; font-size:.78rem; }
  #tut-count { grid-column:1/-1; text-align:center; color:var(--muted); font-size:.76rem; }
  .tutorial-open { width:100%; margin-bottom:14px; }
  .footer-note { margin:18px 4px 0; color:#938a7b; font-size:.72rem; text-align:center; letter-spacing:.04em; }
  .hidden { display:none !important; }
  @media (max-width:780px) {
    body { padding:18px 14px 30px; }
    .game-layout { grid-template-columns:1fr; }
    .side-column { grid-template-columns:1fr 1fr; align-items:start; }
    #tutorial { grid-column:1/-1; }
  }
  @media (max-width:520px) {
    body { padding:12px 9px 24px; }
    .topbar { margin-bottom:15px; }
    .top-note { display:none; }
    .brand-mark { width:40px; height:40px; }
    h1 { font-size:1.2rem; }
    .board-panel { padding:10px; border-radius:16px; }
    .board-frame { padding:5px; }
    .side-column { grid-template-columns:1fr; }
    .side-card { padding:16px; }
    .board-heading h2 { font-size:1rem; }
    #status { min-height:43px; font-size:.84rem; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">棋</div>
      <div>
        <h1>線上象棋</h1>
        <p class="brand-subtitle">XIANGQI · 中式棋藝對弈</p>
      </div>
    </div>
    <div class="top-note">靜心布局・以棋會友</div>
  </header>

  <main class="game-layout">
    <section class="board-panel" aria-label="象棋對弈區">
      <div class="board-heading">
        <div>
          <div class="eyebrow">THE BOARD</div>
          <h2>楚河漢界</h2>
        </div>
        <div class="live-indicator"><span class="live-dot"></span> 對弈進行中</div>
      </div>
      <div class="board-frame">
        <canvas id="board" width="560" height="620" aria-label="象棋棋盤，點擊棋子選擇移動"></canvas>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <aside class="side-column">
      <section class="side-card" aria-label="對局設定與操作">
        <div class="section-heading">
          <div class="section-icon" aria-hidden="true">⚙</div>
          <div><h2>對局設定</h2><p>選擇你的對弈方式</p></div>
        </div>
        <button id="tut-open" class="tutorial-open btn-accent">新手教學　→</button>
        <div class="field-group">
          <label class="field-label" for="mode">對戰模式</label>
          <select id="mode">
            <option value="ai-random" selected>人機對戰・隨機先手</option>
            <option value="ai-red">人機對戰・我執紅先行</option>
            <option value="ai-black">人機對戰・我執黑後行</option>
            <option value="pvp">雙人同機對戰</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label" for="level">電腦難度</label>
          <select id="level">
            <option value="1,500,0" selected>新手</option>
            <option value="1,350">入門</option>
            <option value="1,120">簡單</option>
            <option value="2,40">普通</option>
            <option value="3,6">進階</option>
            <option value="4,6">困難</option>
          </select>
        </div>
        <div class="action-grid" id="game-controls">
          <button id="hint" class="btn-accent">提示走法</button>
          <button id="undo">悔棋</button>
          <button id="restart" class="btn-primary">重新開始對局</button>
        </div>
      </section>

      <section class="side-card" id="tutorial">
        <div class="section-heading">
          <div class="section-icon" aria-hidden="true">書</div>
          <div><h2>新手教學</h2><p>循序認識象棋規則</p></div>
        </div>
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="controls">
          <button id="tut-prev">← 上一課</button>
          <button id="tut-next">下一課 →</button>
          <button id="tut-reset">重看本課</button>
          <button id="tut-exit" class="btn-primary">返回對局</button>
          <span id="tut-count"></span>
        </div>
      </section>

      <section class="side-card">
        <div class="section-heading">
          <div class="section-icon" aria-hidden="true">?</div>
          <div><h2>操作說明</h2><p>快速開始你的第一局</p></div>
        </div>
        <p class="help-copy">點擊己方棋子查看可走位置，再點選藍色標記完成移動。對局中可使用「提示走法」取得建議，或透過「悔棋」返回上一步。</p>
      </section>
    </aside>
  </main>
  <p class="footer-note">XIANGQI · 傳承棋藝，方寸之間見真章</p>
</div>

<script>
/* ================= Engine ================= */
const NAMES = {K:'帥',A:'仕',E:'相',H:'傌',R:'俥',C:'炮',P:'兵',
               k:'將',a:'士',e:'象',h:'馬',r:'車',c:'砲',p:'卒'};
const VALUE = {K:10000,R:900,C:450,H:400,A:200,E:200,P:100};

const isRed = p => p === p.toUpperCase();

function initialBoard() {
  const b = Array.from({length:10}, () => Array(9).fill(null));
  const back = ['r','h','e','a','k','a','e','h','r'];
  back.forEach((p,c) => { b[0][c] = p; b[9][c] = p.toUpperCase(); });
  [1,7].forEach(c => { b[2][c] = 'c'; b[7][c] = 'C'; });
  [0,2,4,6,8].forEach(c => { b[3][c] = 'p'; b[6][c] = 'P'; });
  return b;
}

function gen(b, red) {
  const moves = [];
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = b[r][c];
    if (!p || isRed(p) !== red) continue;
    const t = p.toUpperCase();
    const add = (nr, nc) => {
      if (nr < 0 || nr > 9 || nc < 0 || nc > 8) return false;
      const q = b[nr][nc];
      if (q && isRed(q) === red) return false;
      moves.push([r, c, nr, nc]);
      return !q;
    };
    if (t === 'K') {
      const r0 = red ? 7 : 0, r1 = red ? 9 : 2;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = r + dr, nc = c + dc;
        if (nr >= r0 && nr <= r1 && nc >= 3 && nc <= 5) add(nr, nc);
      }
      const d = red ? -1 : 1;           // 王不見王
      for (let k = r + d; k >= 0 && k <= 9; k += d) {
        const q = b[k][c];
        if (q) { if (q === (red ? 'k' : 'K')) moves.push([r, c, k, c]); break; }
      }
    } else if (t === 'A') {
      const r0 = red ? 7 : 0, r1 = red ? 9 : 2;
      for (const [dr, dc] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
        const nr = r + dr, nc = c + dc;
        if (nr >= r0 && nr <= r1 && nc >= 3 && nc <= 5) add(nr, nc);
      }
    } else if (t === 'E') {
      for (const [dr, dc] of [[2,2],[2,-2],[-2,2],[-2,-2]]) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr > 9 || nc < 0 || nc > 8) continue;
        if (red ? nr < 5 : nr > 4) continue;
        if (b[r + dr / 2][c + dc / 2]) continue;
        add(nr, nc);
      }
    } else if (t === 'H') {
      for (const [dr, dc] of [[-2,-1],[-2,1],[2,-1],[2,1],[-1,-2],[1,-2],[-1,2],[1,2]]) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr > 9 || nc < 0 || nc > 8) continue;
        const lr = Math.abs(dr) === 2 ? r + dr / 2 : r;
        const lc = Math.abs(dr) === 2 ? c : c + dc / 2;
        if (b[lr][lc]) continue;
        add(r + dr, c + dc);
      }
    } else if (t === 'R') {
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        let nr = r + dr, nc = c + dc;
        while (add(nr, nc)) { nr += dr; nc += dc; }
      }
    } else if (t === 'C') {
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8 && !b[nr][nc]) {
          moves.push([r, c, nr, nc]); nr += dr; nc += dc;
        }
        nr += dr; nc += dc;
        while (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8) {
          const q = b[nr][nc];
          if (q) { if (isRed(q) !== red) moves.push([r, c, nr, nc]); break; }
          nr += dr; nc += dc;
        }
      }
    } else if (t === 'P') {
      const f = red ? -1 : 1;
      add(r + f, c);
      if (red ? r <= 4 : r >= 5) { add(r, c - 1); add(r, c + 1); }
    }
  }
  return moves;
}

function make(b, m) {
  const cap = b[m[2]][m[3]];
  b[m[2]][m[3]] = b[m[0]][m[1]];
  b[m[0]][m[1]] = null;
  return cap;
}
function unmake(b, m, cap) {
  b[m[0]][m[1]] = b[m[2]][m[3]];
  b[m[2]][m[3]] = cap;
}

function inCheck(b, red) {
  const king = red ? 'K' : 'k';
  let kr = -1, kc = -1;
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) if (b[r][c] === king) { kr = r; kc = c; }
  if (kr < 0) return true;
  return gen(b, !red).some(m => m[2] === kr && m[3] === kc);
}

function legalMoves(b, red) {
  const out = [];
  for (const m of gen(b, red)) {
    const cap = make(b, m);
    if (!inCheck(b, red)) out.push(m);
    unmake(b, m, cap);
  }
  return out;
}

function evaluate(b, red) {
  let s = 0;
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = b[r][c];
    if (!p) continue;
    const t = p.toUpperCase(), rd = isRed(p);
    let v = VALUE[t];
    if (t === 'P' && (rd ? r <= 4 : r >= 5)) v += 100;
    if (t === 'H' || t === 'R' || t === 'C') v += 12 - Math.abs(c - 4) * 3;
    s += rd ? v : -v;
  }
  return red ? s : -s;
}

const victim = (b, m) => (b[m[2]][m[3]] ? VALUE[b[m[2]][m[3]].toUpperCase()] : 0);
const attacker = (b, m) => VALUE[b[m[0]][m[1]].toUpperCase()];
// Most valuable victim first, then least valuable attacker
const byCapture = b => (x, y) => (victim(b, y) - victim(b, x)) || (attacker(b, x) - attacker(b, y));

// Keep searching captures past the depth limit so the AI sees recaptures (avoids the horizon effect)
function quiesce(b, alpha, beta, red, qdepth) {
  const stand = evaluate(b, red);
  if (stand >= beta || qdepth === 0) return stand;
  if (stand > alpha) alpha = stand;
  const caps = gen(b, red).filter(m => b[m[2]][m[3]]);
  caps.sort(byCapture(b));
  for (const m of caps) {
    if (b[m[2]][m[3]].toUpperCase() === 'K') return 10000;
    const cap = make(b, m);
    const v = -quiesce(b, -beta, -alpha, !red, qdepth - 1);
    unmake(b, m, cap);
    if (v >= beta) return v;
    if (v > alpha) alpha = v;
  }
  return alpha;
}

let qLimit = 4;  // capture-extension depth for the current search; 0 = don't look at recaptures

function negamax(b, depth, alpha, beta, red) {
  if (depth === 0) return quiesce(b, alpha, beta, red, qLimit);
  const moves = gen(b, red);
  moves.sort(byCapture(b));
  let best = -Infinity;
  for (const m of moves) {
    const target = b[m[2]][m[3]];
    if (target && target.toUpperCase() === 'K') return 10000 + depth;
    const cap = make(b, m);
    const v = -negamax(b, depth - 1, -beta, -alpha, !red);
    unmake(b, m, cap);
    if (v > best) best = v;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best === -Infinity ? -9000 : best;
}

// jitter = random noise added to each move's score: small keeps games varied,
// large makes the AI overlook gains and play weaker (used by easy levels)
function chooseMove(b, red, depth, jitter = 6, qdepth = 4) {
  const JITTER = jitter;
  qLimit = qdepth;
  const moves = legalMoves(b, red);
  if (!moves.length) return null;
  moves.sort(byCapture(b));
  let bestMove = null, bestScore = -Infinity;
  for (const m of moves) {
    const cap = make(b, m);
    // Moves that can't beat bestScore - JITTER are cut off early; jitter can't lift them past bestScore
    const v = -negamax(b, depth - 1, -Infinity, -(bestScore - JITTER), !red) + Math.random() * JITTER;
    unmake(b, m, cap);
    if (v > bestScore) { bestScore = v; bestMove = m; }
  }
  return bestMove;
}

/* ================= UI ================= */
const S = 60, M = 40;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let board, redTurn, selected, targets, history, lastMove, over, thinking, flip;
let tut = null;      // current lesson index, null when playing a normal game
let gameId = 0;      // invalidates pending AI moves after a reset

/* ================= Tutorial ================= */
const LESSONS = [
  { title: '帥／將', text: '帥（紅）與將（黑）是最重要的棋子，被將死就輸了。它只能待在<b>九宮</b>（畫斜線的 3×3 區域）裡，每次直走或橫走一格。<br>👉 點擊紅色的「帥」看看它能走到哪裡。',
    pieces: [[8,4,'K'],[2,3,'a'],[0,3,'k']] },
  { title: '仕／士', text: '仕也只能待在九宮裡，每次<b>斜走一格</b>，專門保護帥。',
    pieces: [[9,3,'K'],[8,4,'A'],[0,5,'k']] },
  { title: '相／象', text: '相走「田」字（斜走兩格），而且<b>不能過河</b>。如果「田」字中心有棋子擋住就不能走，稱為<b>塞象眼</b>。<br>👉 左上方被黑卒塞住了，試試看。',
    pieces: [[9,4,'K'],[7,4,'E'],[6,3,'p'],[0,3,'k']] },
  { title: '傌／馬', text: '馬走「日」字：先直走一格，再斜走一格。如果直走的那一格有棋子，就走不過去，稱為<b>蹩馬腿</b>。<br>👉 上方被自己的兵擋住了，所以往上的兩步不能走。',
    pieces: [[9,4,'K'],[5,4,'H'],[4,4,'P'],[0,3,'k']] },
  { title: '俥／車', text: '車可以直線走任意格數，但不能越過棋子；碰到對方棋子就能吃掉。它是威力最強的棋子。<br>👉 試著吃掉右邊的黑馬。',
    pieces: [[9,4,'K'],[5,4,'R'],[5,7,'h'],[0,3,'k']] },
  { title: '炮／砲', text: '炮不吃子時走法和車一樣；要吃子時，必須<b>隔著一個棋子</b>（稱為「炮架」）跳過去吃。<br>👉 隔著黑卒，吃掉最上面的黑車。',
    pieces: [[9,4,'K'],[7,1,'C'],[3,1,'p'],[0,1,'r'],[0,3,'k']] },
  { title: '兵／卒', text: '兵只能往前走一格，不能後退。<b>過河</b>（越過楚河漢界）之後，也可以左右橫走一格。<br>👉 比較左邊（未過河）和右邊（已過河）兩個兵。',
    pieces: [[9,4,'K'],[6,2,'P'],[3,6,'P'],[0,3,'k']] },
  { title: '王不見王', text: '帥和將不能在同一條直線上<b>面對面</b>（中間沒有其他棋子）。<br>👉 點擊帥：它不能往左走，因為那樣會和黑將面對面。',
    pieces: [[9,4,'K'],[0,3,'k']] },
  { title: '練習一：雙車錯殺', text: '攻擊對方的將叫<b>將軍</b>；對方怎麼走都解不了，就是<b>將死</b>，你就贏了（無路可走也算輸，叫「困斃」）。<br>🎯 紅方走一步將死黑將。提示：一隻車已經封住第二排。',
    pieces: [[9,3,'K'],[1,0,'R'],[5,8,'R'],[0,4,'k']], puzzle: true },
  { title: '練習二：馬後炮', text: '🎯 紅方走一步將死黑將。提示：讓馬當炮架，同時封住將的退路。這招叫「馬後炮」。',
    pieces: [[9,3,'K'],[4,3,'H'],[7,4,'C'],[0,4,'k']], puzzle: true },
];

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

function loadLesson(i) {
  tut = i; gameId++;
  const lesson = LESSONS[i];
  board = Array.from({length:10}, () => Array(9).fill(null));
  lesson.pieces.forEach(([r, c, p]) => { board[r][c] = p; });
  redTurn = true; selected = null; targets = []; history = [];
  lastMove = null; over = false; thinking = false; flip = false;
  document.getElementById('tut-title').textContent = `第 ${i + 1} 課　${lesson.title}`;
  document.getElementById('tut-text').innerHTML = lesson.text;
  document.getElementById('tut-count').textContent = `${i + 1} / ${LESSONS.length}`;
  document.getElementById('tut-prev').disabled = i === 0;
  document.getElementById('tut-next').disabled = i === LESSONS.length - 1;
  update();
}

function tutMove(m) {
  make(board, m);
  lastMove = m; selected = null; targets = [];
  if (!LESSONS[tut].puzzle) { update(); return; }
  over = true;
  draw();
  if (!legalMoves(board, false).length) {
    setStatus('答對了！黑將無路可走 🎉', 'win');
  } else {
    setStatus('還沒將死，再試一次…', 'check');
    const id = gameId;
    setTimeout(() => { if (id === gameId) loadLesson(tut); }, 1200);
  }
}

function showTutorial(on) {
  document.getElementById('tutorial').style.display = on ? 'block' : 'none';
  document.getElementById('game-controls').classList.toggle('hidden', on);
}

let aiRed = false;  // true: AI plays red, false: AI plays black, null: two players

function aiSide() { return aiRed; }

function newGame() {
  tut = null; gameId++;
  const mode = document.getElementById('mode').value;
  aiRed = mode === 'pvp' ? null
        : mode === 'ai-random' ? Math.random() < 0.5
        : mode === 'ai-black';
  board = initialBoard();
  redTurn = true; selected = null; targets = []; history = [];
  lastMove = null; over = false; thinking = false;
  flip = aiRed === true;
  update();
  maybeAI();
}

function px(r, c) {
  return [M + (flip ? 8 - c : c) * S, M + (flip ? 9 - r : r) * S];
}

function drawBoard() {
  ctx.fillStyle = '#e3b96b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#4a3216'; ctx.lineWidth = 1.5;
  const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  for (let r = 0; r < 10; r++) line(M, M + r * S, M + 8 * S, M + r * S);
  for (let c = 0; c < 9; c++) {
    if (c === 0 || c === 8) line(M + c * S, M, M + c * S, M + 9 * S);
    else { line(M + c * S, M, M + c * S, M + 4 * S); line(M + c * S, M + 5 * S, M + c * S, M + 9 * S); }
  }
  line(M + 3 * S, M, M + 5 * S, M + 2 * S); line(M + 5 * S, M, M + 3 * S, M + 2 * S);
  line(M + 3 * S, M + 7 * S, M + 5 * S, M + 9 * S); line(M + 5 * S, M + 7 * S, M + 3 * S, M + 9 * S);
  ctx.strokeRect(M - 4, M - 4, 8 * S + 8, 9 * S + 8);
  ctx.fillStyle = '#4a3216'; ctx.font = 'bold 28px "Noto Serif TC","PMingLiU",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(flip ? '漢　　界' : '楚　　河', M + 2 * S, M + 4.5 * S);
  ctx.fillText(flip ? '楚　　河' : '漢　　界', M + 6 * S, M + 4.5 * S);
}

function drawPiece(r, c, p, highlight) {
  const [x, y] = px(r, c);
  const red = isRed(p);
  ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2);
  ctx.fillStyle = '#f6e3bb'; ctx.fill();
  ctx.lineWidth = highlight ? 4 : 2;
  ctx.strokeStyle = highlight ? '#2a7de1' : (red ? '#b3261e' : '#222');
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 21, 0, Math.PI * 2);
  ctx.lineWidth = 1.2; ctx.strokeStyle = red ? '#b3261e' : '#222'; ctx.stroke();
  ctx.fillStyle = red ? '#b3261e' : '#1a1a1a';
  ctx.font = 'bold 28px "Noto Serif TC","PMingLiU",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(NAMES[p], x, y + 2);
}

function draw() {
  drawBoard();
  if (lastMove) {
    ctx.fillStyle = 'rgba(42,125,225,.28)';
    for (const [r, c] of [[lastMove[0], lastMove[1]], [lastMove[2], lastMove[3]]]) {
      const [x, y] = px(r, c); ctx.fillRect(x - 28, y - 28, 56, 56);
    }
  }
  const checked = !over && inCheck(board, redTurn) ? (redTurn ? 'K' : 'k') : null;
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = board[r][c];
    if (!p) continue;
    if (checked && p === checked) {
      const [x, y] = px(r, c);
      ctx.beginPath(); ctx.arc(x, y, 32, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,60,40,.45)'; ctx.fill();
    }
    drawPiece(r, c, p, selected && selected[0] === r && selected[1] === c);
  }
  for (const [r, c] of targets) {
    const [x, y] = px(r, c);
    ctx.beginPath(); ctx.arc(x, y, board[r][c] ? 30 : 8, 0, Math.PI * 2);
    if (board[r][c]) { ctx.lineWidth = 3; ctx.strokeStyle = '#2a7de1'; ctx.stroke(); }
    else { ctx.fillStyle = 'rgba(42,125,225,.8)'; ctx.fill(); }
  }
}

function update() {
  const you = aiRed === null ? '' : `（你執${aiRed ? '黑' : '紅'}）`;
  const side = (redTurn ? '紅方' : '黑方') + you;
  statusEl.className = '';
  if (tut !== null) {
    setStatus(LESSONS[tut].puzzle ? '輪到紅方：一步將死黑將' : '點擊紅色棋子，看看它能走到哪裡');
  } else if (over) {
    // handled in finish()
  } else if (thinking) {
    statusEl.textContent = `電腦思考中…${you}`;
  } else if (inCheck(board, redTurn)) {
    statusEl.textContent = `將軍！輪到${side}`; statusEl.className = 'check';
  } else {
    statusEl.textContent = `輪到${side}`;
  }
  draw();
}

function finish() {
  if (legalMoves(board, redTurn).length) return false;
  over = true;
  statusEl.textContent = `${redTurn ? '黑方' : '紅方'}獲勝！（${inCheck(board, redTurn) ? '將死' : '困斃'}）— 按「悔棋」或「重新開始」`;
  statusEl.className = 'check';
  draw();
  return true;
}

function play(m) {
  const cap = make(board, m);
  history.push({ m, cap });
  lastMove = m; selected = null; targets = [];
  redTurn = !redTurn;
  if (!finish()) update();
}

function maybeAI() {
  const ai = aiSide();
  if (over || ai === null || redTurn !== ai) return;
  thinking = true; update();
  // On a fresh board, pause so the player sees the reset before the AI's opening move
  const fresh = history.length === 0;
  if (fresh) setStatus('新局開始！電腦執紅先走…（你執黑）');
  const id = gameId;
  setTimeout(() => {
    if (id !== gameId) return;
    const [depth, jitter, qdepth = 4] = document.getElementById('level').value.split(',').map(Number);
    let m = null;
    try {
      m = chooseMove(board, redTurn, depth, jitter, qdepth);
    } catch (err) {
      setStatus('電腦出錯了，請按「悔棋」或「重新開始」', 'check');
    } finally {
      thinking = false;
    }
    if (m) play(m);
  }, fresh ? 1200 : 60);
}

canvas.addEventListener('click', e => {
  if (over || thinking) return;
  const ai = tut === null ? aiSide() : null;
  if (ai !== null && redTurn === ai) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * canvas.width / rect.width;
  const y = (e.clientY - rect.top) * canvas.height / rect.height;
  let c = Math.round((x - M) / S), r = Math.round((y - M) / S);
  if (r < 0 || r > 9 || c < 0 || c > 8) return;
  if (flip) { c = 8 - c; r = 9 - r; }

  if (selected && targets.some(t => t[0] === r && t[1] === c)) {
    const m = [selected[0], selected[1], r, c];
    if (tut !== null) { tutMove(m); return; }
    play(m);
    maybeAI();
    return;
  }
  const p = board[r][c];
  if (p && isRed(p) === redTurn) {
    selected = [r, c];
    targets = legalMoves(board, redTurn).filter(m => m[0] === r && m[1] === c).map(m => [m[2], m[3]]);
    if (tut !== null) targets = targets.filter(([tr, tc]) => board[tr][tc] !== 'k');
  } else { selected = null; targets = []; }
  draw();
});

document.getElementById('tut-open').onclick = () => { showTutorial(true); loadLesson(0); };
document.getElementById('tut-prev').onclick = () => loadLesson(tut - 1);
document.getElementById('tut-next').onclick = () => loadLesson(tut + 1);
document.getElementById('tut-reset').onclick = () => loadLesson(tut);
document.getElementById('tut-exit').onclick = () => { showTutorial(false); newGame(); };
// Suggest a move for the player: pre-select the piece and mark its destination
document.getElementById('hint').onclick = () => {
  if (over || thinking || tut !== null) return;
  if (aiRed !== null && redTurn === aiRed) return;
  thinking = true;
  setStatus('想一下該怎麼走…');
  const id = gameId;
  setTimeout(() => {
    if (id !== gameId) return;
    let m = null;
    try {
      m = chooseMove(board, redTurn, 3, 0);
    } catch (err) {
      m = null;
    } finally {
      thinking = false;
    }
    update();
    if (!m) return;
    selected = [m[0], m[1]];
    targets = [[m[2], m[3]]];
    draw();
    setStatus(`💡 建議：把「${NAMES[board[m[0]][m[1]]]}」走到藍圈的位置`);
  }, 60);
};

document.getElementById('restart').onclick = newGame;
document.getElementById('mode').onchange = newGame;
document.getElementById('undo').onclick = () => {
  if (thinking || !history.length) return;
  const ai = aiSide();
  const steps = ai === null ? 1 : (redTurn === ai ? 1 : 2);
  for (let i = 0; i < steps && history.length; i++) {
    const h = history.pop(); unmake(board, h.m, h.cap); redTurn = !redTurn;
  }
  over = false; selected = null; targets = [];
  lastMove = history.length ? history[history.length - 1].m : null;
  update();
  maybeAI();  // undoing back to the AI's turn must let it move again
};

newGame();
</script>
</body>
